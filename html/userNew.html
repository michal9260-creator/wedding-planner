<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הסדרנית לחתונה - הרשמה</title>
    <link rel="stylesheet" href="../style.css">
    <link class="js-favicon" rel="icon" type="image/png" href="../pic/לוגו סמל.png">
</head>

<body>
    <div class="page-wrapper">
        <a href="pageHome.html">
            <img src="../pic/topp.png" alt="לוגו האתר" class="top-logo">
        </a>
        <div class="form-card register-width">
            <h1>יצירת חשבון חדש</h1>
            <form onsubmit="event.preventDefault(); saveToJSON();">
                <table>
                    <tbody>
                        <tr class="row-flex">
                            <td>
                                <label for="fname">שם פרטי</label>
                                <input type="text" id="fname" name="firstname" required>
                            </td>
                            <td>
                                <label for="lname">שם משפחה</label>
                                <input type="text" id="lname" name="lastname" required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="email">דואר אלקטרוני</label>
                                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="phone">מספר טלפון</label>
                                <input type="tel" id="phone" name="phone" placeholder="050-0000000" required>
                            </td>
                        </tr>
                        <tr class="row-flex">
                            <td>
                                <label for="date">תאריך האירוע</label>
                                <input type="date" id="date" name="event_date">
                            </td>
                            <td>
                                <label for="location">אזור בארץ</label>
                                <select id="location" name="location">
                                    <option value="" disabled selected>בחרו...</option>
                                    <option value="center">מרכז</option>
                                    <option value="north">צפון</option>
                                    <option value="south">דרום</option>
                                    <option value="jerusalem">ירושלים</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="password">יצירת סיסמה</label>
                                <input type="password" id="password" name="password" placeholder="לפחות 8 תווים"
                                    required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <br>
                                <button type="submit" class="btn btn-secondary">הרשמה וסיום</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </form>
            <br>
            <div class="link">רשומים באתר? <a href="userExists.html">להתחברות</a></div>



            <script src="../JS/NewUser.js"></script>
        </div>
</body>

</html>
